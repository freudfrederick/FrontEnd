services:
  db:
    image: mysql:8.0
    container_name: chronos_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pomodoro_db
    ports:
      - '3306:3306'
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-proot']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: chronos_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://root:root@db:3306/pomodoro_db
      PORT: 3333
      JWT_SECRET: change-me-in-production
    ports:
      - '3333:3333'
    command: >
      sh -c "npx prisma migrate deploy && npm run dev"

volumes:
  db_data:
